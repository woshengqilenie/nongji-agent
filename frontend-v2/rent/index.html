<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>租赁端 v2 | 农机速配调度平台</title>
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/legacy-compat.css" />
  </head>
  <body>
    <div class="ag-app">
      <header class="ag-header">
        <div class="logo-area"><div class="logo-icon">租</div><span class="logo-title">租赁端 v2</span></div>
        <nav class="nav-tabs header-nav">
          <a class="nav-tab" href="../">总览</a><a class="nav-tab active" href="./">租赁端</a><a class="nav-tab" href="../machine/">农机端</a><a class="nav-tab" href="../supervisor/">主管端</a><a class="nav-tab" href="../atlas/">全域地图</a><a class="nav-tab" href="/ui/rent">旧版</a>
        </nav>
        <div class="operator-area"><span>麦浪网格风</span><span class="avatar">租</span></div>
      </header>
      <main class="page-shell">
        <section class="page-grid market">
          <aside class="panel sidebar-stack">
            <div>
              <h3>地块地图</h3>
              <div class="map-shell compact">
                <div class="map-tools"><button id="rentMapFullscreenBtn" class="btn secondary" type="button">全屏地图</button></div>
                <div id="rentMapCanvas" class="map-canvas compact"></div>
                <div id="rentMapPlaceholder" class="map-placeholder">请先在右上角“外部服务设置”里配置高德地图 Key。</div>
              </div>
            </div>
            <div>
              <h3>天气与地块提示</h3>
              <div id="rentWeatherPanel" class="weather-box"><pre>填写地块坐标或选择订单后，可查看天气预览。</pre></div>
            </div>
          </aside>
          <section class="panel detail-stack">
            <div class="detail-stack">
              <h3>一句话填单</h3>
              <label class="field"><span>智能需求描述</span><textarea id="quickDemandText" placeholder="例如：明天上午收割 220 亩小麦，预算 15000，要求损失率小于 2%"></textarea></label>
              <button id="parseDemandBtn" class="btn warning">智能解析并填充表单</button>
              <div id="parseResult" class="result-box"><pre>这里会显示解析后的结构化结果</pre></div>
            </div>
            <div class="section-divider"></div>
            <div><h3>快速下单</h3></div>
            <div id="selectedServiceBox" class="note-box">请选择一个服务卡片。</div>
            <label class="field"><span>当前租赁方</span><select id="buyerSelect"></select></label>
            <div class="field-grid">
              <label class="field"><span>作业面积（亩）</span><input id="areaInput" type="number" min="1" value="180" /></label>
              <label class="field"><span>紧急程度</span><select id="urgencySelect"><option value="high">加急</option><option value="medium" selected>常规</option><option value="low">普通</option></select></label>
              <label class="field"><span>预计开工时间</span><input id="scheduleStartInput" type="datetime-local" /></label>
              <label class="field"><span>经度</span><input id="lngInput" type="number" step="0.000001" value="119.328600" /></label>
              <label class="field"><span>纬度</span><input id="latInput" type="number" step="0.000001" value="36.551100" /></label>
            </div>
            <label class="field"><span>作业要求 / 地块备注</span><textarea id="requirementInput" placeholder="例如：小麦抢收，靠近村道，收割损失率 &lt;= 2%，下午 5 点前进场。"></textarea></label>
            <div class="inline-actions"><button id="createPayBtn" class="btn primary">创建并托管支付</button><button id="refreshOrdersBtn" class="btn secondary">刷新我的订单</button></div>
            <div id="orderActionHint" class="note-box">下单成功后，这里会显示结果摘要。</div>
            <div class="section-divider"></div>
            <div><h3>AI 下单助理</h3></div>
            <div class="inline-actions"><button id="rentAiExplainBtn" class="btn warning">生成 AI 建议</button></div>
            <div id="rentAiInsight" class="result-box insight-box"><pre>点击按钮后，这里会显示大模型建议。</pre></div>
          </section>
          <aside class="panel sidebar-stack">
            <div><h3>服务品类</h3></div>
            <div id="categoryList" class="category-list"></div>
            <div class="section-divider"></div>
            <div class="panel-head"><div><h3>服务列表</h3></div><div class="toolbar" id="serviceToolbar"></div></div>
            <div id="serviceList" class="list-stack"></div>
            <div id="servicePagination" class="pagination-bar"></div>
          </aside>
        </section>
        <section class="panel detail-stack" style="margin-top: 16px">
          <div><h3>我的订单与验收入口</h3></div>
          <div id="myOrders" class="list-stack"></div>
          <div id="orderPagination" class="pagination-bar"></div>
          <div id="orderDetail" class="detail-stack"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/ui/rent.js"></script>
  </body>
</html>
